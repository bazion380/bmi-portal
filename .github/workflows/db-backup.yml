name: Database Backup to Cloudflare R2

on:
  schedule:
    # Run automatically every day at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual triggering from the GitHub Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client (for pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Setup AWS CLI (for R2 upload)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Dump Database and Compress
        env:
          PGPASSWORD: ${{ secrets.NEON_DB_PASSWORD }}
          DB_HOST: ${{ secrets.NEON_DB_HOST }}
          DB_USER: ${{ secrets.NEON_DB_USER }}
          DB_NAME: ${{ secrets.NEON_DB_NAME }}
        run: |
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          FILENAME="core-db_backup_${TIMESTAMP}.sql.gz"
          
          echo "Starting backup for ${DB_NAME}..."
          pg_dump -h $DB_HOST -U $DB_USER -d $DB_NAME --no-owner --no-acl | gzip > $FILENAME
          
          echo "Backup complete. File size:"
          ls -lh $FILENAME
          
          # Pass filename to next step
          echo "BACKUP_FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Upload to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BACKUP_BUCKET_NAME }}
        run: |
          echo "Uploading $BACKUP_FILENAME to R2 bucket $R2_BUCKET_NAME..."
          
          aws s3 cp $BACKUP_FILENAME s3://$R2_BUCKET_NAME/backups/$BACKUP_FILENAME \
            --endpoint-url https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com

      - name: Notify on Failure
        if: failure()
        run: |
          echo "Database backup workflow failed! Please check the GitHub Actions logs."
          # Optional: Add curl command here to ping a Discord/Slack webhook
